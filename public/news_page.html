<!DOCTYPE html>
<html lang="uk">

<head>

	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title>Новини страхування | iKasko</title>

	<link rel="stylesheet" href="css/news.css">

</head>

<body>

	<header class="header">

		<div class="container">

			<h1>📰 Новини страхування</h1>

			<p>
				Останні новини НБУ, МТСБУ, Мінфіну, Forinsurer та інших джерел
			</p>

		</div>

	</header>

	<main class="container">

		<section class="toolbar">

			<input id="searchInput" type="text" placeholder="Пошук новин...">

			<select id="sourceFilter">

				<option value="">Усі джерела</option>
				<option>НБУ</option>
				<option>МТСБУ</option>
				<option>Мінфін</option>
				<option>Страхнадзор</option>
				<option>Forinsurer</option>

			</select>

		</section>
		<section id="featuredNews" class="featured-news"></section>

		<section id="newsContainer" class="news-grid"></section>
		<section id="newsContainer" class="news-grid">

		</section>

		<div class="load-more">

			<button id="loadMore">

				Показати ще

			</button>

		</div>

	</main>

	<script type="module" src="js/news.js"></script>

</body>

</html>
